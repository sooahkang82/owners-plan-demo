<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Owner’s Plan · 사장님 자금 설계 (데모)</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --p:#6246E5; --p-ink:#4B31C9; --p-soft:#F0EDFF; --p-line:#D9D2FF;
  --ink:#16171D; --ink2:#4A4E5A; --ink3:#8B90A0; --line:#E9EAEF; --bg:#F6F6F9; --card:#fff;
  --ok:#17875F; --ok-bg:#E6F4EE; --warn:#B26A00; --warn-bg:#FFF3DC; --no:#C2412F; --no-bg:#FCE9E6; --chk:#566078; --chk-bg:#EEF0F5;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Wanted Sans Variable","Wanted Sans",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5;letter-spacing:-.012em;word-break:keep-all;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--p);outline-offset:2px;border-radius:6px}

/* 상단 */
.top{position:sticky;top:0;z-index:500;background:rgba(246,246,249,.9);backdrop-filter:blur(12px) saturate(1.3);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.03em;white-space:nowrap}
.logo .x{color:var(--ink3);font-weight:500}
.logo .wm{font-weight:800;letter-spacing:-.035em}
.logo .f{color:var(--ink2);font-weight:700}
.logo svg{width:26px;height:26px;flex:none}
.sp{flex:1}
.seg{display:inline-flex;background:#E9E9F0;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;transition:all .2s}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,20,40,.08)}
.demo{font-size:11px;font-weight:600;color:var(--ink3);white-space:nowrap}

/* 진행 표시 */
.steps{max-width:1180px;margin:0 auto;padding:0 28px 12px;display:flex;gap:6px}
.steps button{flex:1;min-width:0;border:0;background:none;padding:8px 0 0;cursor:pointer;text-align:left;border-top:3px solid #DDDEE6;transition:border-color .3s,color .3s;color:var(--ink3);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps button b{font-weight:700;margin-right:4px}
.steps button.done{border-color:var(--p-line);color:var(--ink2)}
.steps button.on{border-color:var(--p);color:var(--p)}

main{overflow-x:clip;max-width:1180px;margin:0 auto;padding:36px 28px 130px;min-height:70vh}
.page{animation:in .38s cubic-bezier(.2,.7,.2,1) both}
.page.back{animation-name:inb}
@keyframes in{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.kicker{font-size:13px;font-weight:700;color:var(--p)}
h1{margin:6px 0 0;font-size:34px;line-height:1.25;font-weight:800;letter-spacing:-.04em}
.lead{color:var(--ink2);font-size:16px;margin-top:8px}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;margin-top:32px;align-items:start}
.hero{font-size:76px;font-weight:800;letter-spacing:-.05em;line-height:1}
.hero small{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-left:4px}
.one{font-size:15px;color:var(--ink2);margin-top:10px}
.muted{color:var(--ink3)}
.rv{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
.rv.in{opacity:1;transform:none}

.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:99px;padding:4px 11px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.okl{background:#EFF8F3;color:#3E8F70}.st.warnl{background:#FFF1E2;color:#B5651D}.st.ok{background:var(--ok-bg);color:var(--ok)}.st.warn{background:var(--warn-bg);color:var(--warn)}.st.no{background:var(--no-bg);color:var(--no)}.st.chk{background:var(--chk-bg);color:var(--chk)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;border:0;padding:0;margin-left:6px;vertical-align:middle;cursor:pointer;background:#B9BDCB;position:relative;top:-1px}
.dot.est{background:#3B63D9}.dot.asm{background:var(--p)}.dot.apx{background:#1F8CA0}.dot.chk{background:#D48A0C}
.dot::after{content:"";position:absolute;inset:-8px}
#pop{position:fixed;z-index:900;max-width:320px;background:#1E1F27;color:#fff;font-size:12.5px;line-height:1.5;padding:10px 12px;border-radius:10px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);opacity:0;pointer-events:none;transform:translateY(4px);transition:opacity .16s,transform .16s}
#pop.on{opacity:1;transform:none}
#pop b{display:block;font-size:11px;font-weight:700;letter-spacing:.02em;opacity:.7;margin-bottom:2px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0}
.chip .l{font-size:12px;color:var(--ink3)}
.chip .v{font-size:18px;font-weight:700;letter-spacing:-.03em}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--no-bg);color:#8A2A1D;border-radius:16px;padding:16px 18px;margin-top:24px}
.alert.w{background:var(--warn-bg);color:#7A4A00}
.alert b{display:block;font-size:15px}
.alert span{font-size:13.5px}
.alert i{flex:none;width:22px;height:22px;border-radius:50%;background:currentColor;position:relative;margin-top:1px}
.alert i::after{content:"!";position:absolute;inset:0;color:#fff;font-style:normal;font-weight:800;font-size:14px;text-align:center;line-height:22px}
details{margin-top:18px}
summary{cursor:pointer;list-style:none;font-size:13px;font-weight:600;color:var(--ink3);display:inline-flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);transition:transform .2s;margin-top:-3px}
details[open] summary::after{transform:rotate(-135deg);margin-top:2px}
.dl{margin-top:10px;font-size:13px;color:var(--ink2)}
.dl div{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-top:1px solid var(--line)}
.dl div span:last-child{font-weight:600;color:var(--ink);text-align:right}
.srcs{margin:8px 0 0;padding-left:16px;font-size:12px;color:var(--ink3)}

/* 1 시작 */
.chat{max-width:760px;margin-top:28px}
.q{font-size:20px;font-weight:700;letter-spacing:-.03em;margin-top:30px}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:14px 18px;cursor:pointer;text-align:left;transition:all .2s;min-width:150px}
.opt:hover{border-color:var(--p-line);transform:translateY(-1px)}
.opt b{display:block;font-size:16px;font-weight:700}
.opt small{color:var(--ink3);font-size:12.5px}
.opt[aria-pressed=true]{border-color:var(--p);background:var(--p-soft)}
.opt[aria-pressed=true] b{color:var(--p-ink)}
.ans{display:inline-flex;align-items:baseline;gap:8px;background:var(--p);color:#fff;border-radius:18px 18px 4px 18px;padding:12px 18px;font-size:18px;font-weight:700;margin-top:12px}
.ans small{font-weight:500;opacity:.8;font-size:13px}
.sl{margin-top:36px;padding-top:22px;border-top:1px solid var(--line);opacity:.55}
.sl h3{margin:0;font-size:14px;font-weight:700}
.sl .g{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:12px}
.sl label{font-size:12px;color:var(--ink2);display:block}
.sl input{width:100%;accent-color:var(--p)}

/* 2 상권 */
#map{height:440px;border-radius:20px;overflow:hidden;background:#E7E8EE}
.leaflet-container{background:#F2F3F5}
.gray-tiles{filter:grayscale(1) brightness(1.1) contrast(.82) opacity(.85)}
.leaflet-popup-content-wrapper{border-radius:14px;box-shadow:0 10px 28px -10px rgba(20,20,40,.35)}
.leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.45}
.mp b{font-size:14px}
.mpg{display:grid;grid-template-columns:auto auto;gap:3px 14px;margin-top:8px}
.mpg span{color:var(--ink3)}.mpg b{text-align:right;font-size:13px}
.mpn{margin-top:6px;font-size:11.5px;color:var(--ink3)}
.lpin{width:22px;height:22px;background:#6246E5;border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);margin:2px;box-shadow:0 3px 8px rgba(20,20,40,.35)}
.lpin.s{display:inline-block;width:9px;height:9px;border-width:1.5px;margin:0 2px 0 6px;box-shadow:none}
.mlg{background:rgba(255,255,255,.93);border-radius:10px;padding:7px 10px;font-size:11px;line-height:1.3;color:var(--ink2);box-shadow:0 2px 8px rgba(20,20,40,.14);max-width:230px}
.mlg div{display:flex;align-items:center;gap:5px;margin:2px 0;flex-wrap:wrap}
.mlg .grad{display:inline-block;width:46px;height:8px;border-radius:4px;background:linear-gradient(90deg,#5FA08A,#D8B865,#C86F5E)}
.mlg .c1,.mlg .c2{display:inline-block;border-radius:50%;background:#C9CCD6}
.mlg .c1{width:7px;height:7px}.mlg .c2{width:14px;height:14px}
.mlg .ring{display:inline-block;width:11px;height:11px;border-radius:50%;border:2.5px solid #6246E5}
.mlg .ring.d{border:1.5px dashed #16171D;margin-left:6px}
.leaflet-control-attribution{font-size:10px}
.leaflet-container{font:inherit}
.pin{border-radius:50%;box-sizing:border-box;box-shadow:0 2px 6px rgba(20,20,40,.25);transition:transform .2s}
.pin:hover{transform:scale(1.2)}
.lp{width:10px;height:10px;background:#fff;border:2px solid var(--p);border-radius:3px}
.mapnote{font-size:12px;color:var(--ink3);margin-top:8px}
.alts{display:grid;gap:8px;margin-top:12px}
.alt{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;transition:all .2s}
.alt:hover,.alt[aria-pressed=true]{border-color:var(--p)}
.alt b{font-size:15px}.alt small{display:block;color:var(--ink3);font-size:12px}
.alt .n{font-weight:700;font-size:15px}

/* 3 매물·자금 */
.lst{display:grid;gap:10px}
.li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;cursor:pointer;text-align:left;transition:all .2s}
.li[aria-pressed=true]{border-color:var(--p);background:var(--p-soft)}
.li b{font-size:15.5px}.li small{color:var(--ink3);font-size:12.5px;grid-column:1/-1}
.stack{display:flex;flex-direction:column-reverse;gap:4px;height:300px;width:150px;flex:none}
.blk{border-radius:10px;background:var(--p);min-height:6px;flex-grow:0;transform-origin:bottom;animation:drop .5s cubic-bezier(.3,1.4,.5,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scaleY(.6)}to{opacity:1;transform:none}}
.blk.c1{background:#6246E5}.blk.c2{background:#8A74F0}.blk.c3{background:#B3A5F6}.blk.c4{background:#D9D2FF}
.fund{display:flex;gap:28px;align-items:flex-end;margin-top:8px}
.lg{flex:1;min-width:0}
.lg div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.lg div:first-child{border-top:0}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.lg b{font-weight:700}

/* 4 대출 */
.tabs{display:inline-flex;gap:22px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 0;font-size:16px;font-weight:600;color:var(--ink3);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:all .2s}
.tabs button[aria-selected=true]{color:var(--p);border-color:var(--p);font-weight:700}
.puz{display:flex;gap:4px;height:74px;margin-top:18px;background:repeating-linear-gradient(135deg,#E6E7EE 0 8px,#F1F1F6 8px 16px);border-radius:14px;overflow:hidden}
.pc{background:var(--p);color:#fff;padding:10px 12px;font-size:12.5px;font-weight:600;overflow:hidden;white-space:nowrap;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;transform-origin:left;border-radius:4px}
.pc:first-child{border-radius:14px 4px 4px 14px}
.pc b{display:block;font-size:17px;font-weight:800}
.pc.k2{background:#8A74F0}.pc.k3{background:#A99AF4}
@keyframes grow{from{transform:scaleX(0);opacity:.3}to{transform:none;opacity:1}}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cmp div{padding:14px 0}
.cmp div+div{border-left:1px solid var(--line);padding-left:18px}
.cmp .l{font-size:12.5px;color:var(--ink3)}.cmp .v{font-size:22px;font-weight:800;letter-spacing:-.03em}
.cmp.c4{grid-template-columns:repeat(4,1fr)}.cmp .d{font-size:12px;font-weight:700}.up{color:var(--no)}.dn{color:var(--ok)}
.ck{list-style:none;margin:8px 0 0;padding:0}
.ck li{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.ck li:first-child{border-top:0}
.ck label{display:flex;gap:10px;cursor:pointer;align-items:flex-start}
.ck input{accent-color:var(--p);width:17px;height:17px;margin-top:2px;flex:none}
.ck small{display:block;color:var(--ink3);font-size:12px}
.pr{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.pr small{display:block;color:var(--ink3);font-size:12px}
.sumrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 5 생존 */
.gauge{position:relative;width:240px;height:240px;flex:none}
.gauge svg{transform:rotate(-90deg)}
.gauge circle{fill:none;stroke-width:16;stroke-linecap:round}
.gauge .bg{stroke:#E5E6ED}.gauge .fg{stroke:var(--p);transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
.gauge .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.gauge .c b{font-size:52px;font-weight:800;letter-spacing:-.05em;line-height:1}
.gauge .c>span{font-size:12.5px;color:var(--ink3);margin-top:4px}
.chartbox{position:relative}
.chartbox svg{width:100%;height:auto;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:#1E1F27;color:#fff;font-size:12px;padding:8px 10px;border-radius:10px;white-space:nowrap;opacity:0;transition:opacity .12s;transform:translate(-50%,-110%)}
.tip.on{opacity:1}
.tip b{display:block;font-size:11px;opacity:.7}
.play{border:0;background:var(--ink);color:#fff;border-radius:99px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink3);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:16px;border-top:3px solid var(--p);vertical-align:middle;margin-right:6px}
.legend i.d{border-top:2px dashed #A9AEBB}

/* 6 요약 */
.report{background:#fff;border-radius:24px;padding:36px;margin-top:28px}
.k4{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:22px}
.k4 div{padding:18px 0}
.k4 div+div{border-left:1px solid var(--line);padding-left:20px}
.k4 .l{font-size:12.5px;color:var(--ink3)}
.k4 .v{font-size:30px;font-weight:800;letter-spacing:-.04em;margin-top:2px}
.ai{margin-top:22px;border-left:3px solid var(--p);padding:4px 0 4px 16px}
.ai p{margin:6px 0;font-size:15px}
.ai em{font-style:normal;font-size:11px;font-weight:700;color:var(--p-ink);background:var(--p-soft);border-radius:5px;padding:2px 6px;margin-left:6px}
.band{background:#ECEBFB;border-radius:22px;padding:30px 28px;margin-top:26px}
.band.say{text-align:center;margin-top:20px}
.form{margin-top:26px;background:#fff;border-radius:22px;padding:26px;max-width:980px}
.fgrp{padding:14px 0;border-top:1px solid var(--line)}.fgrp:first-child{border-top:0;padding-top:0}
.fgrp>b{font-size:15px}
.fg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide{grid-column:span 2}
.fld>span{font-size:12.5px;font-weight:600;color:var(--ink2)}.fld i{font-style:normal;font-weight:500;color:var(--ink3);font-size:11px;margin-left:3px}
.fld small{font-size:11.5px;color:var(--ink3)}
.fld select,.inw{height:44px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-size:15px;color:var(--ink);padding:0 12px;min-width:0;width:100%}
.inw{display:flex;align-items:center;gap:6px;padding-right:10px}
.inw input{border:0;outline:0;font:inherit;font-size:15px;font-weight:600;width:100%;min-width:0;background:none;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.inw input::-webkit-outer-spin-button,.inw input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.inw em{font-style:normal;font-size:12.5px;color:var(--ink3);white-space:nowrap}
.fld select:focus,.inw:focus-within{border-color:var(--p)}
.seg2{display:flex;gap:6px}
.seg2 button{flex:1;height:44px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer}
.seg2 button[aria-pressed=true]{border-color:var(--p);background:var(--p-soft);color:var(--p-ink)}
.fbtn{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:18px}
.cta:disabled{opacity:.6}
.live{background:#16171D;color:#fff;border-radius:12px;padding:9px 14px;font-size:12.5px;margin-bottom:18px;line-height:1.5}
.live button{border:0;background:none;color:#C9C0FF;font-weight:700;cursor:pointer;padding:0;text-decoration:underline}
.alertbtn:disabled{background:#E9E9F0;color:var(--ink3);cursor:default}
@media (max-width:900px){.fg{grid-template-columns:1fr 1fr}.form{padding:18px}}
.alertbtn{border:0;background:var(--p);color:#fff;border-radius:99px;padding:12px 22px;font-size:14.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.alertbtn[aria-pressed=true]{background:#fff;color:var(--p-ink);box-shadow:inset 0 0 0 1.5px var(--p-line)}
.say .s1{font-size:17px;color:var(--ink2)}
.say .s2{font-size:46px;font-weight:800;letter-spacing:-.045em;color:var(--p);line-height:1.2;margin-top:6px}
.say .s3{font-size:22px;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.say .s4{font-size:13.5px;color:var(--ink2);margin-top:12px}
.flow{display:flex;align-items:flex-start;justify-content:center;gap:10px;max-width:860px}
.fs{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.fs i{width:54px;height:54px;border-radius:16px;background:#fff;color:var(--p);display:grid;place-content:center;box-shadow:0 6px 16px -10px rgba(98,70,229,.6)}
.fs i svg{width:28px;height:28px}
.fs b{font-size:14.5px;letter-spacing:-.02em}
.fs span{font-size:12.5px;color:var(--ink2);display:block}
.flow em{flex:none;width:44px;height:2px;border-radius:2px;background:#C9C4F4;margin-top:27px}
@media (max-width:900px){.flow{flex-direction:column;align-items:stretch;gap:14px}.flow em{display:none}.fs{flex-direction:row;text-align:left;gap:12px}.fs b{display:block}.say .s2{font-size:34px}.band{padding:22px 18px}}
.cta{border:0;background:var(--p);color:#fff;border-radius:99px;padding:17px 34px;font-size:17px;font-weight:700;cursor:default;box-shadow:0 14px 30px -14px rgba(98,70,229,.9);margin-top:26px}

/* ---------- AI에게 물어보기 ---------- */
.qa-card{margin-top:26px;border:1px solid var(--p-line);border-radius:18px;padding:22px;background:#fff}
.qa-ex{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.qa-ex button{border:1px solid var(--p-line);background:var(--p-soft);color:var(--p-ink);border-radius:99px;padding:9px 14px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
.qa-ex button:hover{background:#E5DFFF}
.qa-log{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.qb{max-width:86%;border-radius:18px;padding:12px 16px;font-size:14.5px;line-height:1.55}
.qb.me{align-self:flex-end;background:var(--p);color:#fff;border-bottom-right-radius:6px;font-weight:600}
.qb.ai{align-self:flex-start;background:#F3F2FA;color:var(--ink);border-bottom-left-radius:6px}
.qb.ai p{margin:0 0 6px}.qb.ai p:last-of-type{margin-bottom:0}
.qb.ai .wait{color:var(--ink3)}
.qb.ai .law{display:block;font-size:12px;color:var(--ink3);margin-top:8px}
.qb.ai .lnk{display:inline-block;margin-top:10px;border:0;background:none;padding:0;color:var(--p-ink);font-size:13px;font-weight:700;cursor:pointer;text-decoration:underline;font-family:inherit}
.qa-in{display:flex;gap:8px;margin-top:16px}
.qa-in input{flex:1;min-width:0;border:1px solid var(--line);border-radius:99px;padding:12px 18px;font-size:14.5px;font-family:inherit;outline:none}
.qa-in input:focus{border-color:var(--p)}
/* ---------- 심사 참고 화면 ---------- */
.vd{display:flex;gap:20px;align-items:center;background:#ECEBFB;border-radius:22px;padding:24px 26px;margin-top:22px}
.vd .op{flex:none;font-size:22px;font-weight:800;letter-spacing:-.03em;border-radius:16px;padding:14px 22px;background:#fff;text-align:center;min-width:132px}
.vd .op small{display:block;font-size:11.5px;font-weight:700;color:var(--ink3);letter-spacing:0;margin-bottom:2px}
.vd .op.ok{color:var(--ok)}.vd .op.warn{color:var(--warn)}.vd .op.no{color:var(--no)}.vd .op.chk{color:var(--chk)}
.vd .why{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.45}
.vd .why small{display:block;font-size:12px;font-weight:600;color:var(--ink3);margin-top:6px;letter-spacing:0}
.human{display:flex;gap:10px;align-items:center;background:var(--warn-bg);color:#7A4A00;border-radius:14px;padding:12px 16px;margin-top:10px;font-size:14.5px;font-weight:700}
.human i{flex:none;width:20px;height:20px;border-radius:50%;background:currentColor;position:relative}
.human i::after{content:"!";position:absolute;inset:0;color:#fff;font-style:normal;font-weight:800;font-size:13px;text-align:center;line-height:20px}
.human span{font-weight:500;font-size:12.5px}
.k5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:18px}
.k5>div{border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;background:#fff;min-width:0}
.k5 .l{font-size:12.5px;color:var(--ink3);font-weight:600}
.k5 .v{font-size:25px;font-weight:800;letter-spacing:-.04em;margin-top:4px;white-space:nowrap}
.k5 .d{font-size:12px;color:var(--ink3);margin-top:4px;line-height:1.4}
.k5 .d.bad{color:var(--no);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}
.chips>b{font-size:13.5px;margin-right:4px}
.pt{margin:10px 0 0;padding:0;list-style:none}
.pt li{padding:12px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.5}
.pt li:first-child{border-top:0}
.pt li b{font-weight:700}
.pt details{margin-top:4px}.pt details p{margin:6px 0 0;font-size:13px;color:var(--ink2)}
.rn{font-size:11px;font-weight:600;color:var(--ink3);background:var(--chk-bg);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.sh{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:800}
.fold{border-top:1px solid var(--line);margin-top:26px}
.fold details{margin:0;padding:14px 0;border-bottom:1px solid var(--line)}
.fold summary{font-size:14px;color:var(--ink);display:flex;justify-content:space-between}
.opt-card{margin-top:26px;border:1px solid var(--line);border-radius:18px;padding:22px;background:#FBFBFD}
.otab{margin-top:14px;font-size:13.5px}
.oh,.or{display:grid;grid-template-columns:minmax(0,2.2fr) repeat(5,minmax(0,1fr));gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.oh{border-top:0;font-size:12px;color:var(--ink3);padding-top:0}
.oh span:not(:first-child),.or>span:not(:first-child){text-align:right;font-weight:700}
.or small{display:block;color:var(--ink3);font-size:12px;font-weight:400}
.or.pick{background:var(--p-soft);border-radius:12px;border-top-color:transparent;padding:12px;margin:0 -12px}
.or.na{grid-template-columns:minmax(0,2.2fr) minmax(0,5fr)}
.or.na .x{color:var(--ink3);font-weight:500!important}
@media (max-width:900px){.oh{display:none}.or{grid-template-columns:1fr 1fr}.or>span:first-child{grid-column:1/-1}}
/* 하단 이동 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:400;background:linear-gradient(to top,var(--bg) 65%,rgba(246,246,249,0));padding:20px 28px 22px}
.nav div{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;gap:12px}
.nav button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 22px;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s}
.nav button.nx{background:var(--ink);border-color:var(--ink);color:#fff}
.nav button:disabled{opacity:.3;cursor:default}

@media (max-width:900px){
  .top-in{padding:12px 16px;gap:10px;flex-wrap:wrap}.steps{padding:0 16px 10px}.steps button{font-size:0}.steps button b{font-size:12px}
  main{padding:24px 16px 120px}h1{font-size:26px}.hero{font-size:54px}
  .cols{grid-template-columns:1fr;gap:26px}.k4,.cmp,.cmp.c4{grid-template-columns:1fr 1fr}.k5{grid-template-columns:1fr 1fr}.vd{flex-direction:column;align-items:flex-start}.cmp.c4>div:nth-child(3){border-left:0;padding-left:0}.k4 div:nth-child(3){border-left:0;padding-left:0}
  .sl .g{grid-template-columns:1fr 1fr}.fund{flex-direction:column;align-items:stretch}.stack{width:100%;height:200px}
  #map{height:320px}.report{padding:22px}.gauge{margin:0 auto}.demo{display:none}.nav{padding:16px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="logo" aria-label="finda × Owner’s Plan">
      <span class="f">finda</span><span class="x">×</span>
      <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="12" cy="33" r="9" fill="#6246E5"/><path d="M30 9 L50 17 L50 47 L30 55 Z" fill="#6246E5" stroke="#6246E5" stroke-width="6" stroke-linejoin="round"/></svg>
      <span class="wm">Owner’s Plan</span>
    </div>
    <div class="sp"></div>
    <span class="demo">과제 데모 · 가상 데이터</span>
    <div class="seg" role="group" aria-label="화면 전환"><button data-view="owner" aria-pressed="true">사장님 화면</button><button data-view="staff" aria-pressed="false">심사 참고 화면</button></div>
  </div>
  <nav class="steps" id="steps" aria-label="진행 단계"></nav>
</header>
<main id="app"><p class="muted">불러오는 중이에요…</p></main>
<div class="nav" id="nav"><div><button id="pv">이전</button><button id="nx" class="nx">다음</button></div></div>
<div id="pop" role="tooltip"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STEPS = ['시작', '상권 진단', '매물·필요 자금', '대출 조합', '생존 확률', '결과 요약'];
// 직접 입력: 로컬 서버(server.py)가 있을 때만 쓴다. 입력값은 이 변수에만 있고 저장하지 않는다(새로고침하면 사라짐)
let API = false, OPTS = null, BUSY = false, ERR = null, AIWAIT = false, AIERR = null, calcSeq = 0;
const FORM = {업종: '', 관심상권: '', 출점유형: '2호점 출점', 가진자금: '', 희망대출: '', 대표나이: '', 직원수: '', 연체: '없음', 기존대출잔액: '', 기존대출금리: '', 월매출: '', 월비용: '', 인테리어견적: '', 신용점수: '', 업력개월: ''};
const ALERTS = new Set();   // '매물 알림 받기'를 누른 사장님 (데모: 화면 상태로만 기억)
let IDX = [], D = null, AI = null, ADV = null, step = 1, dir = 1, view = 'owner', tab = '기본', pick = 0, selMk = null, map = null;

function won(v) {
  if (v == null) return '확인 필요';
  const r = Math.round(v), a = Math.abs(r), s = r < 0 ? '-' : '';
  if (a >= 10000) { const e = Math.floor(a / 10000), m = a % 10000; return `${s}${e}억${m ? ' ' + m.toLocaleString('ko-KR') + '만' : ''} 원`; }
  return `${s}${a.toLocaleString('ko-KR')}만 원`;
}
const pct = (v, d = 1) => (v * 100).toFixed(d) + '%';
const stc = s => ({'가능성 높음':'okl','어려울 가능성 높음':'warnl','가능':'ok','양호':'ok','주의':'warn','확인 필요':'chk','판정 보류':'chk','불가':'no','예산 안':'ok','예산 초과':'no'}[s] || 'chk');
const st = s => `<span class="st ${stc(s)}">${esc(s)}</span>`;
function dot(mark, src) {            // 숫자 옆 작은 점: 누르면 표시와 출처
  const m = mark || '데이터';
  const c = m.includes('추정') ? 'est' : m.includes('가정') ? 'asm' : m.includes('근사') ? 'apx' : m.includes('확인') ? 'chk' : '';
  return `<button class="dot ${c}" data-tip="${esc(m)}|${esc(src || '')}" aria-label="${esc(m)} · 출처 보기"></button>`;
}
const cnt = (v, f, extra = '') => `<span data-n="${v}" data-f="${f}">${f === 'won' ? won(0) : f === 'pct' ? '0.0%' : '0'}</span>${extra}`;
function countUp(root) {
  $$('[data-n]', root).forEach(el => {
    const to = +el.dataset.n, f = el.dataset.f, t0 = performance.now(), dur = 800;
    const fmt = v => f === 'won' ? won(v) : f === 'pct' ? pct(v) : f === 'pct0' ? pct(v, 0) : Math.round(v).toLocaleString('ko-KR');
    const tick = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(to * e); if (k < 1) requestAnimationFrame(tick); else el.textContent = fmt(to); };
    requestAnimationFrame(tick);
  });
}
function reveal(root) {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold: 0, rootMargin: '0px 0px -30px 0px'});
  $$('.rv', root).forEach((el, i) => { el.style.transitionDelay = (i * 70) + 'ms'; io.observe(el); });
}
const combo = () => (tab === '확인시' && D.조합.확인시) ? D.조합.확인시 : (D.조합.기본 || D.조합.확인시);
const simv = () => (tab === '확인시' && D.생존.확인시) ? D.생존.확인시 : D.생존.기본;
const listing = () => D.매물 && D.매물.선택.length ? D.매물.선택[Math.min(pick, D.매물.선택.length - 1)] : null;
const fundsOf = () => { const l = listing(); return (l && l.자금) || D.자금; };
const modelReady = v => v && (v.모델 === 'v2' || v.모델 === 'v3');
const reviewBox = () => !D.재검토 ? '' : `<div class="alert rv"><i></i><div><b>출점을 다시 살펴보길 권해요</b><span>${[D.재검토.여유현금 ? `월 여유 현금 ${won(D.요약.월여유현금.값)}` : '', D.재검토.비율 ? `희망자금이 필요 자금의 ${pct(D.재검토.비율값, 0)}` : '', `연체 ${esc(D.요약.연체)}`].filter(Boolean).join(' · ')}</span></div></div>`;

/* ---------- 1 시작 ---------- */
// 직접 그린 선 아이콘 (다른 서비스의 그림을 가져오지 않음)
const ICON = {
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-10.5a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21z"/><circle cx="12" cy="10.5" r="2.3"/></svg>',
  calc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8.5 7.5h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h3.5"/></svg>',
  bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1.5 3.5h-3z"/><path d="M10.5 7.5C7 9.5 5 12.5 5 16a4 4 0 0 0 4 4h6a4 4 0 0 0 4-4c0-3.5-2-6.5-5.5-8.5"/><path d="M9.5 13l1 3.5 1.5-3 1.5 3 1-3.5"/></svg>',
};
function fld(k, label, o = {}) {
  const v = esc(FORM[k]);
  const input = o.options
    ? `<select data-f="${k}">${o.blank ? `<option value="">${o.blank}</option>` : ''}${o.options.map(x => `<option value="${esc(x.v)}" ${String(FORM[k]) === String(x.v) ? 'selected' : ''}>${esc(x.t)}</option>`).join('')}</select>`
    : `<span class="inw"><input data-f="${k}" type="${o.type || 'number'}" inputmode="${o.type === 'text' ? 'text' : 'decimal'}" min="0" value="${v}" placeholder="${esc(o.ph || '')}">${o.unit ? `<em>${o.unit}</em>` : ''}</span>`;
  return `<label class="fld ${o.wide ? 'wide' : ''}"><span>${label}${o.opt ? ' <i>선택</i>' : ''}</span>${input}${o.help ? `<small>${o.help}</small>` : ''}</label>`;
}
function p1() {
  const s = D.요약, has = FORM.출점유형 !== '예비창업';
  const sectors = OPTS ? OPTS.업종.map(x => ({v: x.이름, t: x.이름 + (x.구분 === '근사' ? ' (비슷한 업종 기준)' : '')})) : [];
  const areas = OPTS ? OPTS.상권.map(x => ({v: x.이름, t: `${x.이름} · ${x.시군구}`})) : [];
  return `<div class="kicker">1 / 6 · 시작</div><h1>사장님 정보를<br>알려 주세요</h1>
  <div class="band flow rv" aria-label="이용 순서">
    <div class="fs"><i>${ICON.pin}</i><b>상권·업종·자금 입력</b><span>사장님이 넣는 것</span></div><em></em>
    <div class="fs"><i>${ICON.calc}</i><b>필요 자금·대출 조합·생존 확률</b><span>코드가 계산하고 AI가 설명</span></div><em></em>
    <div class="fs"><i>${ICON.bag}</i><b>핀다에서 대출 신청</b><span>결과를 보고 사장님이 결정</span></div>
  </div>
  ${API ? `<div class="form rv">
    <div class="fgrp"><b>어떤 가게를 여시나요?</b>
      <div class="fg">${fld('업종', '업종', {options: sectors, blank: '업종 고르기'})}${fld('관심상권', '관심 상권', {options: areas, blank: '상권 고르기'})}
        <div class="fld wide"><span>출점 유형</span><div class="seg2">${OPTS.출점유형.map(x => `<button type="button" data-kind="${x}" aria-pressed="${FORM.출점유형 === x}">${x === '사업장 이전' ? '이전' : x === '2호점 출점' ? '2호점' : x}</button>`).join('')}</div></div></div></div>
    <div class="fgrp"><b>자금</b>
      <div class="fg">${fld('가진자금', '가진 자금', {unit: '만 원', ph: '예: 2000'})}${fld('희망대출', '희망 대출 금액', {unit: '만 원', ph: '예: 5000'})}${fld('기존대출잔액', '기존 대출 잔액', {unit: '만 원', ph: '없으면 0'})}${fld('기존대출금리', '기존 대출 금리', {unit: '%', ph: '예: 5.5', help: '비우면 한국은행 평균(가정)'})}
        ${fld('인테리어견적', '인테리어·장비 견적', {unit: '만 원', opt: true, help: '넣으면 가정 대신 이 값을 써요'})}</div></div>
    <div class="fgrp"><b>사장님</b>
      <div class="fg">${fld('대표나이', '대표 나이', {unit: '세', ph: '예: 38'})}${fld('직원수', '직원 수', {unit: '명', ph: '예: 2'})}${fld('연체', '최근 1년 연체', {options: OPTS.연체.map(x => ({v: x, t: x}))})}${fld('신용점수', '신용점수', {unit: '점', opt: true, help: '비우면 750점(가정)'})}</div></div>
    ${has ? `<div class="fgrp"><b>기존 가게</b>
      <div class="fg">${fld('월매출', '월매출', {unit: '만 원', ph: '예: 2500'})}${fld('월비용', '월비용', {unit: '만 원', ph: '예: 1900', help: '재료비·인건비·임차료 등 전부'})}${fld('업력개월', '영업한 기간', {unit: '개월', opt: true, help: '비우면 36개월(가정)'})}</div></div>` : ''}
    ${ERR ? `<div class="alert"><i></i><div><b>${esc(ERR)}</b></div></div>` : ''}
    <div class="fbtn"><button class="cta" type="button" data-calc="1" ${BUSY ? 'disabled' : ''} style="cursor:pointer;margin-top:0">${BUSY ? '계산하는 중…' : '이 정보로 계산하기'}</button>
      <span class="mapnote">입력값은 저장하지 않아요. 새로고침하면 사라져요 · 실서비스에서는 핀다 앱 정보로 자동 입력돼요</span></div>
  </div>` : `<div class="alert w rv"><i></i><div><b>직접 입력은 로컬 서버로 열어야 쓸 수 있어요</b><span>finda 폴더에서 python server.py 를 실행한 뒤 http://localhost:5173 으로 열어 주세요. 지금은 예시만 볼 수 있어요</span></div></div>`}

async function calcLive(body, opt = {}) {

// 실서비스에서는 상용 지도(카카오맵 등)로 바꿔야 함
const MAP_TILES = {url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', subdomains: 'abc', gray: true,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'};

function drawMap() {

  map.attributionControl.setPrefix(false);

  const ns = mp.상권.map(m => m.점포수), nlo = Math.min(...ns), nhi = Math.max(...ns);
  const rad = n => 7 + 15 * Math.sqrt(nhi > nlo ? (n - nlo) / (nhi - nlo) : 0);
  const order = {'기타': 0, '대안': 1, '관심': 2};
  mp.상권.slice().sort((a, b) => order[a.역할] - order[b.역할]).forEach(m => {
    const focus = m.역할 === '관심', alt = m.역할 === '대안';

      .addTo(map).bindPopup(areaPop(m), {maxWidth: 240, closeButton: false}).bindTooltip(m.상권명, {direction: 'top', offset: [0, -4]})

  });

}

async function askQ(q) {

    <details><summary>대출 조합 ${c ? c.rows.length + '개 상품 · ' + won(c.금액) : '없음'} · 상품 판정 가능 ${n['가능'] || 0} / 확인 필요 ${n['확인 필요'] || 0} / 불가 ${n['불가'] || 0}</summary>
      ${c ? `<div class="dl">${c.rows.map(r => `<div><span>${esc(r.상품명)} ${st(r.상태)}<br><span class="muted">${esc(r.금융사)} · ${esc(r.상환방식)} · ${r.기간}개월 · ${r.최저금리}~${r.최고금리}%</span></span><span>${won(r.금액)}</span></div>`).join('')}
        <div><span>총이자${c.보증료 > 0.5 ? ' + 보증료' : ''}</span><span>${won(c.총이자)}${c.보증료 > 0.5 ? ' + ' + won(c.보증료) : ''}</span></div></div>
        ${c.선택 && c.선택.이유 ? `<p class="mapnote">왜 이 조합인가요: ${esc(c.선택.이유)}</p>` : ''}` : ''}</details>
    ${ADV && ADV.자격해석 && ADV.자격해석.length ? `<details><summary><span>AI 자격 해석 ${ADV.자격해석.length}건<span class="rn">R7-1</span></span></summary><div class="dl">${ADV.자격해석.map(x => `<div><span>${esc(x.상품코드)} ${esc(x.상품명)} · “${esc(x.인용)}”${x.법령 ? `<br>${esc(x.법령.법령명)} ${esc(x.법령.조문번호)} · “${esc(x.법령.인용문)}”` : ''}<br><span class="muted">${esc(x.이유)}</span></span><span>${st(x.AI판정)}</span></div>`).join('')}</div></details>` : ''}
    ${ADV && ADV.선택지추천 && ADV.선택지추천.추천 ? `<details><summary><span>사장님에게 보인 선택지 추천: ${esc(ADV.선택지추천.추천)}<span class="rn">R8-1 · R8-2</span></span></summary><div class="dl">${ADV.선택지추천.이유.map(x => `<div><span>${esc(x)}</span><span></span></div>`).join('')}</div></details>` : ''}
    <details><summary>그 밖에 확인할 것 ${todo.length}개</summary><ul class="ck">${todo.map(([a, b]) => `<li><label><input type="checkbox"><span>${esc(a)}<small>${esc(b)}</small></span></label></li>`).join('')}</ul></details>
    <details><summary>추정·가정으로 채운 값 ${est.length}개</summary><div class="dl">${est.map(([a, b]) => `<div><span>${esc(a)}</span><span>${esc(b)}</span></div>`).join('')}</div></details>
    <details><summary>적용된 판단 규칙 ${D.규칙.length}개</summary><div class="dl">${D.규칙.map(r => `<div><span><span class="rn" style="margin-left:0">${esc(r.번호)}</span></span><span style="font-weight:500">${esc(r.내용)}</span></div>`).join('')}</div></details>
  </div>
  <p class="mapnote">기준일 ${esc(D.기준일)} · 모두 가상 데이터 · 데모</p>`;
}

/* ---------- 그리기 ---------- */
function render() {
  const app = $('#app'), isStaff = view === 'staff';
  $('#steps').style.display = isStaff ? 'none' : ''; $('#nav').style.display = isStaff ? 'none' : '';
  $('#steps').innerHTML = STEPS.map((n, i) => `<button data-step="${i + 1}" class="${i + 1 === step ? 'on' : i + 1 < step ? 'done' : ''}" aria-current="${i + 1 === step ? 'step' : 'false'}"><b>${i + 1}</b>${n}</button>`).join('');
  const lv = D.실시간, liveBar = !lv ? '' : `<div class="live">${lv.직접입력 ? '직접 입력한 값으로 계산한 결과예요' : '예시를 바꿔서 다시 계산한 결과예요'} · 입력값은 저장하지 않아요${lv.가정으로채운값 && lv.가정으로채운값.length ? ' · 가정: ' + lv.가정으로채운값.map(esc).join(', ') : ''}${AIWAIT ? ' · <b>AI 해석 준비 중</b>' : ''}${lv.예시 ? ` · <button data-id="${esc(lv.예시)}">처음 예시로</button>` : ''}</div>`;
  app.innerHTML = `<div class="page ${dir < 0 ? 'back' : ''}">${liveBar}${isStaff ? staff() : [p1, p2, p3, p4, p5, p6][step - 1]()}</div>`;
  $('#pv').disabled = step === 1; $('#nx').disabled = step === 6; $('#nx').textContent = step === 6 ? '끝' : `다음 · ${STEPS[step]}`;
  countUp(app); reveal(app);
  if (!isStaff && step === 6) drawQA();
  if (!isStaff && step === 2) drawMap();
  if (!isStaff && step === 5) { drawChart(false); const g = $('#gf'); if (g) requestAnimationFrame(() => requestAnimationFrame(() => g.style.strokeDashoffset = g.dataset.to)); }
  $$('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === view));
}
function go(n, keepScroll) { dir = n >= step ? 1 : -1; step = Math.max(1, Math.min(6, n)); render(); if (!keepScroll) scrollTo({top: 0}); }
async function load(id) {
  D = await (await fetch(`data/${id}.json?t=${Date.now()}`)).json();
  try { const r = await fetch(`data/ai_${id}.json?t=${Date.now()}`); AI = r.ok ? await r.json() : null; } catch (e) { AI = null; }
  try { const r = await fetch(`data/advice_${id}.json?t=${Date.now()}`); ADV = r.ok ? await r.json() : null; } catch (e) { ADV = null; }
  try { const r = await fetch(`data/qa_${id}.json?t=${Date.now()}`); QAFIX[id] = r.ok ? (await r.json()).답 : []; } catch (e) { QAFIX[id] = []; }
  tab = '기본'; pick = 0; selMk = null; AIWAIT = false; AIERR = null; ERR = null; ++calcSeq; history.replaceState(null, '', '#' + id); render();
}
document.addEventListener('click', e => {
  const pop = $('#pop'), d = e.target.closest('.dot');
  if (d) { e.preventDefault(); e.stopPropagation(); const [m, s] = d.dataset.tip.split('|'); pop.innerHTML = `<b>${esc(m)}</b>${esc(s || '출처는 접힌 항목에서 볼 수 있어요')}`; const r = d.getBoundingClientRect(); pop.style.left = Math.max(12, Math.min(innerWidth - 332, r.left - 20)) + 'px'; pop.style.top = (r.bottom + 10) + 'px'; pop.classList.add('on'); return; }
  pop.classList.remove('on');
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.q) return askQ(t.dataset.q);
  if (t.dataset.scroll) { const o = $('.opt-card'); if (o) o.scrollIntoView({behavior: 'smooth', block: 'start'}); return; }
  if (t.dataset.id) load(t.dataset.id);
  else if (t.dataset.step) go(+t.dataset.step);
  else if (t.id === 'pv') go(step - 1);
  else if (t.id === 'nx') go(step + 1);
  else if (t.dataset.view) { view = t.dataset.view; dir = 1; render(); scrollTo({top: 0}); }
  else if (t.dataset.tab) { tab = t.dataset.tab; dir = 1; const y = scrollY; render(); scrollTo({top: y}); }
  else if (t.dataset.pick) { pick = +t.dataset.pick;
    if (API) calcLive(liveBody({listing_id: D.매물.선택[pick].id}));        // 매물을 바꾸면 그 매물로 전체를 다시 계산
    else { dir = 1; const y = scrollY; render(); scrollTo({top: y}); } }
  else if (t.dataset.calc) calcLive({input: FORM}, {step: 2});
  else if (t.dataset.kind) { FORM.출점유형 = t.dataset.kind; dir = 1; const y = scrollY; render(); scrollTo({top: y}); }
  else if (t.dataset.rearea) { if (selMk) { if (D.실시간 && D.실시간.직접입력) FORM.관심상권 = selMk; calcLive(liveBody({area: selMk})); } }
  else if (t.dataset.mk) pickMk(t.dataset.mk);
  else if (t.dataset.alert) { ALERTS.has(D.id) ? ALERTS.delete(D.id) : ALERTS.add(D.id); dir = 1; const y = scrollY; render(); scrollTo({top: y}); }
  else if (t.id === 'play') drawChart(true);
});
document.addEventListener('input', e => { const f = e.target.dataset && e.target.dataset.f; if (f) FORM[f] = e.target.value; });
document.addEventListener('change', e => { const f = e.target.dataset && e.target.dataset.f; if (f) FORM[f] = e.target.value; });
addEventListener('keydown', e => { if (view !== 'owner' || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return; if (e.key === 'ArrowRight') go(step + 1); if (e.key === 'ArrowLeft') go(step - 1); });
(async () => {
  try { const o = await fetch('/api/options'); if (o.ok) { OPTS = await o.json(); API = true; } } catch (e) { API = false; }
  try { IDX = await (await fetch('data/index.json?t=' + Date.now())).json(); const w = location.hash.slice(1); await load(IDX.some(m => m.id === w) ? w : IDX[0].id); }
  catch (err) { $('#app').innerHTML = '<h1>데이터를 불러오지 못했어요</h1><p class="lead">python engine/export.py 를 실행한 뒤 웹 서버로 열어 주세요.</p>'; }
})();
</script>
</body>
